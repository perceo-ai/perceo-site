name: Archductor Package Repositories

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Archductor release version without leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APT and DNF repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c dpkg-dev gnupg rpm

      - name: Build package repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          ARCHDUCTOR_APT_SIGNING_KEY: ${{ secrets.ARCHDUCTOR_APT_SIGNING_KEY }}
          ARCHDUCTOR_RPM_SIGNING_KEY: ${{ secrets.ARCHDUCTOR_RPM_SIGNING_KEY }}
          ARCHDUCTOR_APT_GPG_KEY_ID: ${{ secrets.ARCHDUCTOR_APT_GPG_KEY_ID }}
          ARCHDUCTOR_RPM_GPG_KEY_ID: ${{ secrets.ARCHDUCTOR_RPM_GPG_KEY_ID }}
          ARCHDUCTOR_GPG_KEY_ID: ${{ secrets.ARCHDUCTOR_GPG_KEY_ID }}
          ARCHDUCTOR_GPG_PASSPHRASE: ${{ secrets.ARCHDUCTOR_GPG_PASSPHRASE }}
        run: npm run build:archductor-repos

      - name: Commit repository artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git add public/apt public/rpm
          if git diff --cached --quiet -- public/apt public/rpm; then
            echo "package repositories already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Archductor package repositories for ${VERSION}"
          git push
